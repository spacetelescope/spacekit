[build-system]
requires = [
    "setuptools>=61.2",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "spacekit"
version = "1.1.5"
description = "Astronomical Data Science and Machine Learning Toolkit"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Ru Keïn", email = "rkein@stsci.edu" }
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "tensorflow>=2.16.1",
    "astropy",
    "boto3",
    "numpy>=1.25",
    "pandas",
    "scikit-learn>=1.3.2",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/spacetelescope/spacekit"
Source = "https://github.com/spacetelescope/spacekit"
Documentation = "https://www.spacekit.org"
Tracker = "https://github.com/spacetelescope/spacekit/issues"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "pytest-profiling",
    "tox",
    "bandit",
    "moto",
    "black",
    "ruff",
]
docs = [
    "sphinx",
    "furo",
    "pydot",
    "graphviz",
    "sphinx-automodapi",
    "numpydoc",
    "sphinx-autobuild",
]
x = [
    "astroquery",
    "matplotlib<4",
    "pydot",
    "graphviz",
    "plotly",
    "progressbar",
    "scikeras",
    "tables",
    "tqdm",
]

[tool.setuptools]
zip-safe = false
include-package_data = true

[tool.setuptools.packages]
find = {}

[tool.setuptools.package-data]
spacekit = ["builder/trained_networks/*"]

[tool.pytest.ini_options]
testpaths = ["spacekit/tests"]
doctest_plus = "enabled"
text_file_format = "md"

[tool.coverage.run]
omit = [
    "spacekit/*setup_package*",
    "spacekit/tests/*",
    "spacekit/*/tests/*",
    "spacekit/version*",
    "*/spacekit/*setup_package*",
    "*/spacekit/tests/*",
    "*/spacekit/*/tests/*",
    "docs/*",
    "spacekit/__init__.py",
]


[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "except ImportError",
    "raise AssertionError",
    "raise NotImplementedError",
    "def main\\(.*\\):",
    "pragma: py{ignore_python_version}",
    "def _ipython_key_completions_",
    "if __name__ == '__main__':",
]

[tool.ruff]
line-length = 130
exclude = [
    'docs',
    'docker',
    'build',
    '.tox',
    '.eggs',
    '.git',
    '__pycache__',
    'dist',
    '.egg',
]
[tool.ruff.lint]
ignore = [
    'E741', # ambiguous variable name
    'UP017', # Use `datetime.UTC` alias
]

[tool.ruff.lint.per-file-ignores]
    'spacekit/preprocessor/scrub.py' = ['E712']