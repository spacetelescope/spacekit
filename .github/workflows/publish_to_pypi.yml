name: Publish to PyPI

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      version:
        description: Version (tag)
        required: true

      test:
        description: testpypi
        required: false
        default: false
        type: boolean


permissions:
  id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
  contents: read

jobs:

  build_artifacts:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.inputs.version || github.event.release.tag_name }}
        fetch-depth: 0

    - name: Install Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'

    - name: Install build tools
      shell: 'bash'
      run: python -m pip install build

    - name: Build sdist and wheel
      shell: 'bash'
      run: python -m build --sdist --wheel .

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: python-package-distributions
        path: dist/*


  test_pypi:
    needs: [ build_artifacts ]
    # Triggers if mnaully checked 'test' OR automated prerelease
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.test == 'true') || (github.event_name == 'release' && github.event.release.prerelease == true) }}

    runs-on: ubuntu-latest
    env:
      url: https://test.pypi.org/legacy/
      password: 
    environment: 
        name: pypi_release
        url:  ${{ env.url }}
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ env.url }}
          verify-metadata: true
          skip-existing: false
          verbose:  true
  
  publish_pypi:
    needs: [ build_artifacts ]
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.test == 'false') || (github.event_name == 'release' && github.event.release.prerelease == false) }}
    runs-on: ubuntu-latest
    environment: 
        name: pypi_release
        url:  https://upload.pypi.org/legacy/
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verify-metadata: true
          skip-existing: false
          verbose:  true
